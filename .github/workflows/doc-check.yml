name: doc-check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Whitespace and conflict-marker check
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit; skipping range check"
            exit 0
          fi
          git diff --check "$BASE"..HEAD

      - name: Markdown link and anchor check
        run: python scripts/check_links.py

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Structure and hygiene check
        run: python scripts/check_structure.py

  ci-ok:
    name: ci-ok
    needs: [links, structure]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gated jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for name, data in sorted(needs.items()):
              print(f'{name}: {data["result"]}')
          bad = {n: d["result"] for n, d in needs.items() if d["result"] != "success"}
          if bad:
              print("ci-ok FAILED - gated jobs not green:", bad)
              sys.exit(1)
          print("ci-ok OK - all gated jobs succeeded")
          PYEOF
