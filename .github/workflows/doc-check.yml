name: doc-check

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Whitespace and conflict-marker check
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit; skipping range check"
            exit 0
          fi
          git diff --check "$BASE"..HEAD

      - name: Markdown link and anchor check
        run: python scripts/check_links.py

  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Structure and hygiene check
        run: python scripts/check_structure.py

      - name: Structure-checker regression tests
        run: python -m unittest discover -s tests -p test_structure.py

      - name: Runtime-budget checker unit tests
        run: python -m unittest discover -s tests -p test_runtime_budget.py

      - name: Coverage-gate regression tests
        run: python tests/check_coverage_gate.py --selftest

      - name: Install pinned rust-code-analysis-cli 0.0.25
        shell: bash
        run: |
          set -e
          curl --retry 3 --max-time 15 -fsSL -o /tmp/rca.tgz "https://github.com/mozilla/rust-code-analysis/releases/download/v0.0.25/rust-code-analysis-linux-cli-x86_64.tar.gz"
          echo "9ec2a217b8ff191e02dab5d5f2eee6158b63fd975c532b2c5d67c2e6c7249894  /tmp/rca.tgz" | sha256sum -c -
          tar -xzf /tmp/rca.tgz -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/rust-code-analysis-cli" --version)" = "rust-code-analysis-cli 0.0.25"

      - name: Complexity checker regression tests
        env:
          DW_COMPLEXITY_ANALYZER: ${{ runner.temp }}/rust-code-analysis-cli
        run: python -m unittest discover -s tests -p 'test_complexity*.py'

      - name: Complexity policy enforcement
        env:
          DW_COMPLEXITY_ANALYZER: ${{ runner.temp }}/rust-code-analysis-cli
        run: python scripts/check_complexity.py --analyzer "$DW_COMPLEXITY_ANALYZER" --report-dir "${{ runner.temp }}/dw-complexity-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload complexity report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dw-complexity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dw-complexity-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Resolve diff base
        id: base
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=50 origin master
            BASE="$(git merge-base FETCH_HEAD HEAD)"
          fi
          git rev-parse --verify "$BASE^{commit}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Runtime diff budget check
        run: python scripts/check_runtime_budget.py --base "${{ steps.base.outputs.base }}" --head HEAD

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start owned PostgreSQL 17 on loopback
        shell: bash
        run: |
          set -e
          ADMIN_PW="ci-$(openssl rand -hex 16)"
          RT_PW="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$ADMIN_PW"
          echo "::add-mask::$RT_PW"
          echo "ADMIN_PW=$ADMIN_PW" >> "$GITHUB_ENV"
          echo "RT_PW=$RT_PW" >> "$GITHUB_ENV"
          docker run -d --name dwpg \
            -e POSTGRES_PASSWORD="$ADMIN_PW" \
            -p 127.0.0.1:5432:5432 \
            postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f

      - name: Bounded readiness and runtime role setup
        shell: bash
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker exec dwpg pg_isready -U postgres >/dev/null 2>&1; then break; fi
            [ "$i" = 30 ] && { echo "postgres did not become ready"; exit 1; }
            sleep 1
          done
          {
            echo "CREATE DATABASE dw_test;"
            echo "CREATE ROLE dw_test_runtime LOGIN PASSWORD '$RT_PW';"
          } | docker exec -i dwpg psql -U postgres -v ON_ERROR_STOP=1 >/dev/null

      - name: Rust toolchain 1.94.1
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Install pinned cargo-llvm-cov 0.9.1
        run: |
          set -e
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          echo "3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.cargo/bin"
          cargo llvm-cov --version

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Full test suite under coverage instrumentation (real PostgreSQL 17)
        env:
          DW_TEST_ADMIN_DATABASE_URL: postgres://postgres:${{ env.ADMIN_PW }}@127.0.0.1:5432/dw_test
          DW_TEST_DATABASE_URL: postgres://dw_test_runtime:${{ env.RT_PW }}@127.0.0.1:5432/dw_test
        run: |
          set -e
          cargo llvm-cov clean --workspace
          mkdir -p target/llvm-cov
          cargo llvm-cov --locked --all-targets --json --output-path target/llvm-cov/m0a-coverage.json
          cargo llvm-cov report --text --output-path target/llvm-cov/m0a-coverage.txt
          cat target/llvm-cov/m0a-coverage.txt

      - name: Coverage gate (90% total / 80% per production file)
        run: python3 tests/check_coverage_gate.py target/llvm-cov/m0a-coverage.json

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m0a-coverage
          path: |
            target/llvm-cov/m0a-coverage.json
            target/llvm-cov/m0a-coverage.txt
          if-no-files-found: error
          retention-days: 14

      - name: Always clean up PostgreSQL container
        if: always()
        run: docker rm -f dwpg || true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.94.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tools and inputs (pinned cargo-deny, audit asset, advisory-db)
        shell: bash
        run: |
          set -e
          rustup toolchain install 1.94.1 --profile minimal
          cargo install --locked --version 0.20.2 cargo-deny --root "$RUNNER_TEMP/dw-tools"
          "$RUNNER_TEMP/dw-tools/bin/cargo-deny" --version
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 -fsSL \
            -o "$RUNNER_TEMP/cargo-audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          sha256sum "$RUNNER_TEMP/cargo-audit.tgz"
          mkdir -p "$RUNNER_TEMP/depsec-evidence"
          git clone --depth 1 https://github.com/RustSec/advisory-db "$RUNNER_TEMP/advisory-db"
          git -C "$RUNNER_TEMP/advisory-db" rev-parse HEAD | tee "$RUNNER_TEMP/depsec-evidence/advisory-db-rev.txt"
          echo "event=${{ github.event_name }} checkout=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}') pr_head=${{ github.event.pull_request.head.sha || '' }}" \
            | tee "$RUNNER_TEMP/depsec-evidence/checkout-binding.txt"

      - name: Dependency gate (deny policy, verified audit, negative controls)
        env:
          DW_AUDIT_HELPER: ${{ github.workspace }}/scripts/run_cargo_audit.sh
          DW_AUDIT_ARCHIVE: ${{ runner.temp }}/cargo-audit.tgz
          DW_DENY_BIN: ${{ runner.temp }}/dw-tools/bin/cargo-deny
          DW_DENY_CONFIG: ${{ github.workspace }}/deny.toml
          DW_PROJECT_ROOT: ${{ github.workspace }}
          DW_ADVISORY_DB: ${{ runner.temp }}/advisory-db
          DW_EVIDENCE_DIR: ${{ runner.temp }}/depsec-evidence
        run: python -m unittest discover -s tests -p test_dependency_security.py -v

      - name: Upload dependency-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: depsec-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/depsec-evidence/
          if-no-files-found: warn
          retention-days: 14

  geiger:
    # Diagnostic only: unsafe-usage baseline, excluded from ci-ok.needs.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.94.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain and pinned cargo-geiger 0.13.0
        run: |
          set -e
          rustup toolchain install 1.94.1 --profile minimal
          cargo install --locked --version 0.13.0 cargo-geiger --root "$RUNNER_TEMP/dw-tools"
          "$RUNNER_TEMP/dw-tools/bin/cargo-geiger" --version

      - name: Geiger unsafe-usage baseline (retained, native status)
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/geiger"
          rustc --version && cargo --version
          set +e
          "$RUNNER_TEMP/dw-tools/bin/cargo-geiger" geiger --locked --all-targets \
            --output-format Json > "$RUNNER_TEMP/geiger/geiger.json" \
            2> "$RUNNER_TEMP/geiger/geiger.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/geiger/geiger.log"
          echo "cargo-geiger exit status: $status"
          exit "$status"

      - name: Upload Geiger baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geiger-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/geiger/
          if-no-files-found: warn
          retention-days: 14

  ci-ok:
    name: ci-ok
    needs: [links, structure, rust, codeql, dependencies]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gated jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for name, data in sorted(needs.items()):
              print(f'{name}: {data["result"]}')
          bad = {n: d["result"] for n, d in needs.items() if d["result"] != "success"}
          if bad:
              print("ci-ok FAILED - gated jobs not green:", bad)
              sys.exit(1)
          print("ci-ok OK - all gated jobs succeeded")
          PYEOF
