[package]
name = "duskweave"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
postgres = { version = "=0.19.14", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "=1.26.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
