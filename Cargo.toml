[package]
name = "duskweave"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "duskweave"

[features]
# Opt-in development tooling: the fixture supervisor/service-check executable.
fixture-supervisor = ["dep:process-wrap"]

[dependencies]
genai = { path = "third_party/genai", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "=1.54.1", features = ["rt", "sync", "time"] }
postgres = { version = "=0.19.14", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "=1.29.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
curl = "=0.4.51"
process-wrap = { version = "=10.0.1", optional = true, default-features = false, features = ["std", "job-object", "process-group"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[[bin]]
name = "duskweave"
path = "src/main.rs"

[[bin]]
name = "dw-fixture-supervisor"
path = "src/bin/dw-fixture-supervisor/main.rs"
required-features = ["fixture-supervisor"]

[dev-dependencies]
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry"] }
